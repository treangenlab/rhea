[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhea"
version = "1.0.0"
description = "Reference-free heterogeneity and evolution in assembly graphs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kristen Curry", email = "kristen.curry@rice.edu"}
]
keywords = ["metagenomics", "structural variants", "assembly graphs", "long-read sequencing"]

[project.scripts]
rhea = "rhea:main"

[project.urls]
Repository = "https://github.com/treangenlab/rhea"
